name: Build PandaPewPew server image

# Builds the k3s server image (Bun backend + Godot headless) for the Pi
# nodes and pushes it to GHCR. k8s/ is excluded so the manifest tag-pin
# commit does not trigger a pointless rebuild.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - project.godot
      - scripts/**
      - scenes/**
      - server/**
      - .github/workflows/build-server-image.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/pandatwoxx/pandapewpew/pandapewpew-server:latest
            ghcr.io/pandatwoxx/pandapewpew/pandapewpew-server:${{ github.sha }}
